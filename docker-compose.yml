version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: delivery_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: delivery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: delivery_backend
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/delivery_db
      JWT_SECRET: super-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && npm start"

  frontend:
    build: ./frontend
    container_name: delivery_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
