"backend/prisma/schema.prisma": `generator client {
  provider = "prisma-client-js"
}

datasource db {
  provider = "postgresql"
  url      = env("DATABASE_URL")
}

model User {
  id        String   @id @default(uuid())
  name      String
  email     String   @unique
  password  String
  role      Role     @default(CONSUMER)
  createdAt DateTime @default(now())
  updatedAt DateTime @updatedAt
  stores    Store[]
  orders    Order[]
  @@map("users")
}

enum Role {
  ADMIN
  CONSUMER
}

model Store {
  id          String   @id @default(uuid())
  name        String
  description String?
  openTime    String
  closeTime   String
  imageUrl    String?
  adminId     String
  createdAt   DateTime @default(now())
  updatedAt   DateTime @updatedAt
  admin       User      @relation(fields: [adminId], references: [id], onDelete: Cascade)
  products    Product[]
  orders      Order[]
  @@map("stores")
}

model Product {
  id          String  @id @default(uuid())
  name        String
  description String?
  price       Decimal @db.Decimal(10, 2)
  available   Boolean @default(true)
  imageUrl    String?
  storeId     String
  store       Store       @relation(fields: [storeId], references: [id], onDelete: Cascade)
  orderItems  OrderItem[]
  createdAt   DateTime @default(now())
  updatedAt   DateTime @updatedAt
  @@map("products")
}

model Order {
  id         String      @id @default(uuid())
  userId     String
  storeId    String
  status     OrderStatus @default(PENDING)
  totalPrice Decimal     @db.Decimal(10, 2)
  createdAt  DateTime    @default(now())
  updatedAt  DateTime    @updatedAt
  user       User        @relation(fields: [userId], references: [id], onDelete: Cascade)
  store      Store       @relation(fields: [storeId], references: [id])
  orderItems OrderItem[]
  @@map("orders")
}

enum OrderStatus {
  PENDING
  PREPARING
  DELIVERED
  CANCELLED
}

model OrderItem {
  id        String  @id @default(uuid())
  orderId   String
  productId String
  quantity  Int
  unitPrice Decimal @db.Decimal(10, 2)
  order     Order   @relation(fields: [orderId], references: [id], onDelete: Cascade)
  product   Product @relation(fields: [productId], references: [id])
  @@map("order_items")
}
`,

"backend/src/middlewares/auth.middleware.js": `const jwt = require('jsonwebtoken');
const prisma = require('../config/prisma');

const authenticate = async (req, res, next) => {
  const authHeader = req.headers.authorization;
  if (!authHeader || !authHeader.startsWith('Bearer ')) {
    return res.status(401).json({ error: 'Token não fornecido' });
  }
  const token = authHeader.split(' ')[1];
  try {
    const payload = jwt.verify(token, process.env.JWT_SECRET);
    const user = await prisma.user.findUnique({ where: { id: payload.sub } });
    if (!user) return res.status(401).json({ error: 'Usuário não encontrado' });
    req.user = user;
    next();
  } catch {
    return res.status(401).json({ error: 'Token inválido ou expirado' });
  }
};

const authorize = (...roles) => (req, res, next) => {
  if (!roles.includes(req.user.role)) {
    return res.status(403).json({ error: 'Acesso não autorizado' });
  }
  next();
};

module.exports = { authenticate, authorize };
`,

"backend/src/middlewares/error.middleware.js": `const errorHandler = (err, req, res, next) => {
  console.error(err);
  if (err.code === 'P2002') return res.status(409).json({ error: 'Registro já existe' });
  if (err.code === 'P2025') return res.status(404).json({ error: 'Registro não encontrado' });
  return res.status(err.status || 500).json({ error: err.message || 'Erro interno do servidor' });
};
module.exports = { errorHandler };
`,

"backend/src/services/auth.service.js": `const bcrypt = require('bcryptjs');
const jwt = require('jsonwebtoken');
const prisma = require('../config/prisma');

class AuthService {
  async register({ name, email, password, role = 'CONSUMER' }) {
    const existing = await prisma.user.findUnique({ where: { email } });
    if (existing) throw Object.assign(new Error('E-mail já cadastrado'), { status: 409 });
    const hashed = await bcrypt.hash(password, 10);
    const user = await prisma.user.create({
      data: { name, email, password: hashed, role },
      select: { id: true, name: true, email: true, role: true, createdAt: true },
    });
    const token = this._generateToken(user.id);
    return { user, token };
  }

  async login({ email, password }) {
    const user = await prisma.user.findUnique({ where: { email } });
    if (!user) throw Object.assign(new Error('Credenciais inválidas'), { status: 401 });
    const valid = await bcrypt.compare(password, user.password);
    if (!valid) throw Object.assign(new Error('Credenciais inválidas'), { status: 401 });
    const { password: _, ...safeUser } = user;
    return { user: safeUser, token: this._generateToken(user.id) };
  }

  _generateToken(userId) {
    return jwt.sign({ sub: userId }, process.env.JWT_SECRET, {
      expiresIn: process.env.JWT_EXPIRES_IN || '7d',
    });
  }
}

module.exports = new AuthService();
`,

"backend/src/services/store.service.js": `const prisma = require('../config/prisma');

const isStoreOpen = (openTime, closeTime) => {
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const [openH, openM] = openTime.split(':').map(Number);
  const [closeH, closeM] = closeTime.split(':').map(Number);
  const openMinutes = openH * 60 + openM;
  const closeMinutes = closeH * 60 + closeM;
  if (closeMinutes < openMinutes) {
    return currentMinutes >= openMinutes || currentMinutes < closeMinutes;
  }
  return currentMinutes >= openMinutes && currentMinutes < closeMinutes;
};

const addIsOpen = (store) => ({ ...store, isOpen: isStoreOpen(store.openTime, store.closeTime) });

class StoreService {
  async getOpenStores() {
    const stores = await prisma.store.findMany({
      include: { admin: { select: { name: true } }, _count: { select: { products: true } } },
      orderBy: { name: 'asc' },
    });
    return stores.map(addIsOpen).filter((s) => s.isOpen);
  }

  async getAllStores(adminId) {
    const stores = await prisma.store.findMany({
      where: { adminId },
      include: { _count: { select: { products: true, orders: true } } },
      orderBy: { createdAt: 'desc' },
    });
    return stores.map(addIsOpen);
  }

  async getById(id) {
    const store = await prisma.store.findUniqueOrThrow({
      where: { id },
      include: { admin: { select: { name: true } }, products: { where: { available: true }, orderBy: { name: 'asc' } } },
    });
    return addIsOpen(store);
  }

  async create(data, adminId) { return prisma.store.create({ data: { ...data, adminId } }); }

  async update(id, data, adminId) {
    await this._assertOwnership(id, adminId);
    return prisma.store.update({ where: { id }, data });
  }

  async delete(id, adminId) {
    await this._assertOwnership(id, adminId);
    return prisma.store.delete({ where: { id } });
  }

  async _assertOwnership(id, adminId) {
    const store = await prisma.store.findUniqueOrThrow({ where: { id } });
    if (store.adminId !== adminId) throw Object.assign(new Error('Acesso não autorizado'), { status: 403 });
  }
}

module.exports = new StoreService();
`,

"backend/src/services/product.service.js": `const prisma = require('../config/prisma');

class ProductService {
  async getByStore(storeId) {
    return prisma.product.findMany({
      where: { storeId },
      orderBy: [{ available: 'desc' }, { name: 'asc' }],
    });
  }

  async create(data, adminId) {
    const store = await prisma.store.findUniqueOrThrow({ where: { id: data.storeId } });
    if (store.adminId !== adminId) throw Object.assign(new Error('Acesso negado'), { status: 403 });
    return prisma.product.create({ data });
  }

  async update(id, data, adminId) {
    await this._assertOwnership(id, adminId);
    return prisma.product.update({ where: { id }, data });
  }

  async delete(id, adminId) {
    await this._assertOwnership(id, adminId);
    return prisma.product.delete({ where: { id } });
  }

  async _assertOwnership(id, adminId) {
    const product = await prisma.product.findUniqueOrThrow({
      where: { id },
      include: { store: { select: { adminId: true } } },
    });
    if (product.store.adminId !== adminId) throw Object.assign(new Error('Acesso negado'), { status: 403 });
  }
}

module.exports = new ProductService();
`,

"backend/src/services/order.service.js": `const prisma = require('../config/prisma');
const storeService = require('./store.service');

class OrderService {
  async create({ storeId, items }, userId) {
    const store = await storeService.getById(storeId);
    if (!store.isOpen) throw Object.assign(new Error('Loja está fechada no momento'), { status: 400 });

    const productIds = items.map((i) => i.productId);
    const products = await prisma.product.findMany({
      where: { id: { in: productIds }, storeId, available: true },
    });
    if (products.length !== items.length) {
      throw Object.assign(new Error('Um ou mais produtos inválidos ou indisponíveis'), { status: 400 });
    }

    const productMap = Object.fromEntries(products.map((p) => [p.id, p]));
    let totalPrice = 0;
    const orderItems = items.map(({ productId, quantity }) => {
      const product = productMap[productId];
      const unitPrice = Number(product.price);
      totalPrice += unitPrice * quantity;
      return { productId, quantity, unitPrice };
    });

    return prisma.order.create({
      data: { userId, storeId, totalPrice, status: 'PENDING', orderItems: { create: orderItems } },
      include: { orderItems: { include: { product: { select: { name: true } } } }, store: { select: { name: true } } },
    });
  }

  async getUserOrders(userId) {
    return prisma.order.findMany({
      where: { userId },
      include: { store: { select: { id: true, name: true } }, orderItems: { include: { product: { select: { name: true } } } } },
      orderBy: { createdAt: 'desc' },
    });
  }

  async getStoreOrders(storeId, adminId) {
    const store = await prisma.store.findUniqueOrThrow({ where: { id: storeId } });
    if (store.adminId !== adminId) throw Object.assign(new Error('Acesso negado'), { status: 403 });
    return prisma.order.findMany({
      where: { storeId },
      include: { user: { select: { name: true, email: true } }, orderItems: { include: { product: { select: { name: true } } } } },
      orderBy: { createdAt: 'desc' },
    });
  }

  async updateStatus(orderId, status, adminId) {
    const order = await prisma.order.findUniqueOrThrow({
      where: { id: orderId },
      include: { store: { select: { adminId: true } } },
    });
    if (order.store.adminId !== adminId) throw Object.assign(new Error('Acesso negado'), { status: 403 });
    return prisma.order.update({ where: { id: orderId }, data: { status } });
  }
}

module.exports = new OrderService();
`,

"frontend/src/services/api.js": `import axios from 'axios';
const api = axios.create({ baseURL: process.env.REACT_APP_API_URL ? process.env.REACT_APP_API_URL + '/api' : '/api' });
api.interceptors.request.use((config) => {
  const token = localStorage.getItem('token');
  if (token) config.headers.Authorization = \`Bearer \${token}\`;
  return config;
});
api.interceptors.response.use((res) => res.data, (err) => Promise.reject(err.response?.data || err));
export const authAPI = {
  register: (data) => api.post('/auth/register', data),
  login: (data) => api.post('/auth/login', data),
  me: () => api.get('/auth/me'),
};
export const storesAPI = {
  getOpen: () => api.get('/stores/open'),
  getById: (id) => api.get(\`/stores/\${id}\`),
  getMyStores: () => api.get('/stores'),
  create: (data) => api.post('/stores', data),
  update: (id, data) => api.put(\`/stores/\${id}\`, data),
  delete: (id) => api.delete(\`/stores/\${id}\`),
};
export const productsAPI = {
  getByStore: (storeId) => api.get(\`/products/store/\${storeId}\`),
  create: (data) => api.post('/products', data),
  update: (id, data) => api.put(\`/products/\${id}\`, data),
  delete: (id) => api.delete(\`/products/\${id}\`),
};
export const ordersAPI = {
  create: (data) => api.post('/orders', data),
  myOrders: () => api.get('/orders/my'),
  storeOrders: (storeId) => api.get(\`/orders/store/\${storeId}\`),
  updateStatus: (id, status) => api.patch(\`/orders/\${id}/status\`, { status }),
};
`,

"frontend/src/contexts/AuthContext.js": `import { createContext, useContext, useState, useEffect } from 'react';
import { authAPI } from '../services/api';
const AuthContext = createContext(null);
export function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const token = localStorage.getItem('token');
    if (token) { authAPI.me().then(setUser).catch(() => localStorage.removeItem('token')).finally(() => setLoading(false)); }
    else { setLoading(false); }
  }, []);
  const login = async (credentials) => { const { user, token } = await authAPI.login(credentials); localStorage.setItem('token', token); setUser(user); return user; };
  const register = async (data) => { const { user, token } = await authAPI.register(data); localStorage.setItem('token', token); setUser(user); return user; };
  const logout = () => { localStorage.removeItem('token'); setUser(null); };
  return <AuthContext.Provider value={{ user, loading, login, register, logout }}>{children}</AuthContext.Provider>;
}
export const useAuth = () => useContext(AuthContext);
`,

"frontend/src/contexts/CartContext.js": `import { createContext, useContext, useState } from 'react';
const CartContext = createContext(null);
export function CartProvider({ children }) {
  const [cart, setCart] = useState({ storeId: null, storeName: '', items: [] });
  const addItem = (product, storeId, storeName) => {
    setCart((prev) => {
      if (prev.storeId && prev.storeId !== storeId) {
        if (!window.confirm(\`Limpar carrinho de "\${prev.storeName}" e adicionar de "\${storeName}"?\`)) return prev;
        return { storeId, storeName, items: [{ ...product, quantity: 1 }] };
      }
      const existing = prev.items.find((i) => i.id === product.id);
      if (existing) return { ...prev, storeId, storeName, items: prev.items.map((i) => i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i) };
      return { storeId, storeName, items: [...prev.items, { ...product, quantity: 1 }] };
    });
  };
  const removeItem = (productId) => setCart((prev) => { const items = prev.items.filter((i) => i.id !== productId); return items.length === 0 ? { storeId: null, storeName: '', items: [] } : { ...prev, items }; });
  const updateQuantity = (productId, quantity) => { if (quantity < 1) { removeItem(productId); return; } setCart((prev) => ({ ...prev, items: prev.items.map((i) => i.id === productId ? { ...i, quantity } : i) })); };
  const clearCart = () => setCart({ storeId: null, storeName: '', items: [] });
  const total = cart.items.reduce((sum, i) => sum + Number(i.price) * i.quantity, 0);
  const count = cart.items.reduce((sum, i) => sum + i.quantity, 0);
  return <CartContext.Provider value={{ cart, addItem, removeItem, updateQuantity, clearCart, total, count }}>{children}</CartContext.Provider>;
}
export const useCart = () => useContext(CartContext);
`

function log(msg, cls = 'info') {
  const div = document.getElementById('log');
  div.style.display = 'block';
  const line = document.createElement('div');
  line.className = 'log-line ' + cls;
  line.textContent = msg;
  div.appendChild(line);
  div.scrollTop = div.scrollHeight;
}

function toBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

async function uploadFile(token, user, repo, path, content) {
  const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
  
  // Check if file exists first
  let sha = undefined;
  try {
    const check = await fetch(url, { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } });
    if (check.ok) { const data = await check.json(); sha = data.sha; }
  } catch(e) {}

  const body = { message: `add ${path}`, content: toBase64(content) };
  if (sha) body.sha = sha;

  const res = await fetch(url, {
    method: 'PUT',
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  return res.ok;
}

async function startUpload() {
  const token = document.getElementById('token').value.trim();
  const user = document.getElementById('user').value.trim();
  const repo = document.getElementById('repo').value.trim();

  if (!token || !user || !repo) { alert('Preencha todos os campos!'); return; }

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';

  document.getElementById('progress').style.display = 'block';
  document.getElementById('log').innerHTML = '';

  log(`🚀 Iniciando upload para ${user}/${repo}...`);

  const fileList = Object.entries(files);
  let done = 0;

  for (const [path, content] of fileList) {
    log(`📤 ${path}...`, 'info');
    try {
      const ok = await uploadFile(token, user, repo, path, content);
      if (ok) { log(`✅ ${path}`, 'ok'); }
      else { log(`❌ Falha: ${path}`, 'err'); }
    } catch(e) {
      log(`❌ Erro em ${path}: ${e.message}`, 'err');
    }
    done++;
    document.getElementById('bar').style.width = `${Math.round(done / fileList.length * 100)}%`;
    await new Promise(r => setTimeout(r, 200));
  }

  log(`\n🎉 Concluído! ${done} arquivos processados.`, 'ok');
  btn.textContent = '✅ Upload Concluído!';

  const doneEl = document.getElementById('done');
  doneEl.style.display = 'block';
  const link = document.getElementById('repo-link');
